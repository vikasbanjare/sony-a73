name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System tools (ffmpeg for take encoding/proxies; g++ for the firmware compile check)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg g++
      - run: pip install -e ".[dev]"
      - name: Unit tests + end-to-end simulation
        run: pytest -q
      - name: Simulation report artifact
        if: matrix.python-version == '3.12'
        run: a7iii sim --out sim_report
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: sim-report
          path: sim_report
